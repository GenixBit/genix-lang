name: Genix CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GENIX_RUNTIME: ${{ github.workspace }}/genix-runtime
      GENIX_STDLIB: ${{ github.workspace }}/genix-stdlib

    steps:
      - name: Checkout compiler
        uses: actions/checkout@v4

      - name: Checkout Genix runtime
        uses: actions/checkout@v4
        with:
          repository: GenixBit/genix-runtime
          path: genix-runtime

      - name: Checkout Genix stdlib
        uses: actions/checkout@v4
        with:
          repository: GenixBit/genix-stdlib
          path: genix-stdlib

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check compiler
        run: cargo check

      - name: Run tests
        run: cargo test

      - name: Verify professional diagnostics
        run: |
          cat > /tmp/genix-type-error.gb <<'GB'
          fn main() {
              let age: int = "twenty";
          }
          GB
          set +e
          type_output=$(cargo run --quiet -- check /tmp/genix-type-error.gb 2>&1)
          type_status=$?
          set -e
          test $type_status -ne 0
          echo "$type_output"
          echo "$type_output" | grep 'error\[E0201\]'
          echo "$type_output" | grep '/tmp/genix-type-error.gb:2:'
          echo "$type_output" | grep '\^'
          echo "$type_output" | grep 'help:'

          cat > /tmp/genix-syntax-error.gb <<'GB'
          fn main( {
          GB
          set +e
          syntax_output=$(cargo run --quiet -- check /tmp/genix-syntax-error.gb 2>&1)
          syntax_status=$?
          set -e
          test $syntax_status -ne 0
          echo "$syntax_output"
          echo "$syntax_output" | grep 'error\[E0100\]'
          echo "$syntax_output" | grep '/tmp/genix-syntax-error.gb:1:'
          echo "$syntax_output" | grep '\^'

          cat > /tmp/genix-lexer-error.gb <<'GB'
          fn main() { @ }
          GB
          set +e
          lexer_output=$(cargo run --quiet -- check /tmp/genix-lexer-error.gb 2>&1)
          lexer_status=$?
          set -e
          test $lexer_status -ne 0
          echo "$lexer_output"
          echo "$lexer_output" | grep 'error\[E0001\]'
          echo "$lexer_output" | grep '/tmp/genix-lexer-error.gb:1:'
          echo "$lexer_output" | grep '\^'

      - name: Verify gb test runner
        run: |
          rm -rf /tmp/genix-test-app
          cargo run --quiet -- new /tmp/genix-test-app
          test_output=$(cargo run --quiet -- test /tmp/genix-test-app)
          echo "$test_output"
          echo "$test_output" | grep 'Genix Test Runner'
          echo "$test_output" | grep '✓ arithmetic works'
          echo "$test_output" | grep '1 passed'
          echo "$test_output" | grep '0 failed'

          cat > /tmp/genix-standalone-test.gb <<'GB'
          fn double(value: int) -> int {
              return value * 2;
          }

          test "standalone helpers work" {
              assert(double(4) == 8);
              pass();
          }
          GB
          standalone_output=$(cargo run --quiet -- test /tmp/genix-standalone-test.gb)
          echo "$standalone_output"
          echo "$standalone_output" | grep '✓ standalone helpers work'

          cat > /tmp/genix-failing-test.gb <<'GB'
          test "failure is reported" {
              assert(2 + 2 == 5);
          }
          GB
          set +e
          failure_output=$(cargo run --quiet -- test /tmp/genix-failing-test.gb 2>&1)
          failure_status=$?
          set -e
          test $failure_status -ne 0
          echo "$failure_output"
          echo "$failure_output" | grep '✗ failure is reported'
          echo "$failure_output" | grep 'assertion failed'
          echo "$failure_output" | grep '1 failed'

      - name: Test runtime independently
        run: make -C genix-runtime test

      - name: Run hello example
        run: cargo run -- run examples/hello.gb

      - name: Validate basics example
        run: cargo run -- check examples/basics.gb

      - name: Run control-flow example
        run: cargo run -- run examples/control_flow.gb

      - name: Run typed-functions example
        run: cargo run -- run examples/functions.gb

      - name: Check multi-file project
        run: cargo run -- check examples/project

      - name: Run multi-file project
        run: cargo run -- run examples/project

      - name: Inspect typed Genix IR
        run: cargo run -- ir examples/project

      - name: Verify explicit IR widening cast
        run: cargo run -- ir examples/functions.gb | grep 'cast<float>'

      - name: Check standard library project
        run: cargo run -- check examples/stdlib

      - name: Run standard library project
        run: cargo run -- run examples/stdlib

      - name: Inspect standard library IR
        run: cargo run -- ir examples/stdlib | grep 'math.square'

      - name: Build standard library native executable
        run: cargo run -- build examples/stdlib

      - name: Execute standard library native binary
        run: ./examples/stdlib/build/stdlib-demo

      - name: Check host intrinsic project
        run: cargo run -- check examples/intrinsics

      - name: Run host intrinsics through interpreter
        run: |
          export GENIX_INTRINSIC_TEST=interpreter-host-ok
          output=$(printf 'Ada\n' | cargo run --quiet -- run examples/intrinsics)
          echo "$output"
          echo "$output" | grep 'Hello Ada'
          echo "$output" | grep 'interpreter-host-ok'
          rm -f intrinsic-demo.txt

      - name: Build host intrinsic native executable
        run: cargo run -- build examples/intrinsics

      - name: Verify intrinsic runtime lowering
        run: |
          grep 'gb_input' examples/intrinsics/build/intrinsic-demo.c
          grep 'gb_fs_write_text' examples/intrinsics/build/intrinsic-demo.c
          grep 'gb_fs_read_text' examples/intrinsics/build/intrinsic-demo.c
          grep 'gb_env_get' examples/intrinsics/build/intrinsic-demo.c

      - name: Execute host intrinsics in native binary
        run: |
          export GENIX_INTRINSIC_TEST=native-host-ok
          output=$(printf 'Grace\n' | ./examples/intrinsics/build/intrinsic-demo)
          echo "$output"
          echo "$output" | grep 'Hello Grace'
          echo "$output" | grep 'native-host-ok'
          rm -f intrinsic-demo.txt

      - name: Check Option Result error handling
        run: cargo run -- check examples/error_handling

      - name: Inspect Option Result IR
        run: |
          output=$(cargo run --quiet -- ir examples/error_handling)
          echo "$output"
          echo "$output" | grep 'Result<string,string>'
          echo "$output" | grep 'Option<string>'
          echo "$output" | grep 'match'

      - name: Run safe IO through interpreter
        run: |
          unset GENIX_CI_MISSING_VALUE || true
          output=$(cargo run --quiet -- run examples/error_handling)
          echo "$output"
          echo "$output" | grep 'missing-env-ok'
          echo "$output" | grep 'Genix safe IO'
          rm -f genix-safe-io.txt

      - name: Build safe IO native executable
        run: cargo run -- build examples/error_handling

      - name: Verify Option Result native lowering
        run: |
          grep 'GbOptionString' examples/error_handling/build/error-handling-demo.c
          grep 'GbResultString' examples/error_handling/build/error-handling-demo.c
          grep 'gb_env_get_option' examples/error_handling/build/error-handling-demo.c
          grep 'gb_fs_try_read_text' examples/error_handling/build/error-handling-demo.c
          grep 'gb_fs_try_write_text' examples/error_handling/build/error-handling-demo.c
          grep '\.ok' examples/error_handling/build/error-handling-demo.c

      - name: Execute safe IO native binary
        run: |
          unset GENIX_CI_MISSING_VALUE || true
          output=$(./examples/error_handling/build/error-handling-demo)
          echo "$output"
          echo "$output" | grep 'missing-env-ok'
          echo "$output" | grep 'Genix safe IO'
          rm -f genix-safe-io.txt

      - name: Build native debug executable with runtime
        run: cargo run -- build examples/project

      - name: Verify generated code targets runtime ABI
        run: |
          grep 'genix/runtime.h' examples/project/build/module-demo.c
          grep 'gb_runtime_init' examples/project/build/module-demo.c
          grep 'gb_print_' examples/project/build/module-demo.c

      - name: Execute native debug binary
        run: ./examples/project/build/module-demo

      - name: Build native release executable with runtime
        run: cargo run -- build examples/project --release

      - name: Execute native release binary
        run: ./examples/project/build/module-demo

      - name: Smoke test project creation
        run: |
          cargo run -- new /tmp/genix-ci-app
          cargo run -- check /tmp/genix-ci-app
          cargo run -- test /tmp/genix-ci-app
          cargo run -- ir /tmp/genix-ci-app
          cargo run -- run /tmp/genix-ci-app
          cargo run -- build /tmp/genix-ci-app
          /tmp/genix-ci-app/build/genix-ci-app
